<tr data-slug="{{show.slug}}">
  <th scope="row"><a href="{{show.url}}"><span class="pr-num">{{show.num}}</span><span class="pr-name"><span class="pr-th">{{show.th}}</span><span class="pr-en">{{show.en}}</span></span></a></th>
  <td class="pr-price">{{#show.priceFrom}}<span class="price-from">เริ่มต้น</span>{{/show.priceFrom}}<span class="price-amount">{{show.priceText}}</span></td>
  <td class="pr-pick">
    <a class="btn btn-gold" href="/contact/?show={{show.slug}}">สอบถาม</a>
  </td>
</tr>
