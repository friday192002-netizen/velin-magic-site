<article class="guide-page">
  <section class="page-hero" aria-labelledby="page-title">
    <div class="page-aura" aria-hidden="true"></div>
    <div class="container narrow">
      {{{crumbs}}}
      <div data-reveal>
        <p class="kicker">{{guide.kicker}}</p>
        <h1 id="page-title">{{guide.title}}</h1>
        <p class="page-lede">{{guide.intro}}</p>
      </div>
    </div>
  </section>

  <section class="section section-ivory section-tight" aria-label="เนื้อหา">
    <div class="container narrow guide-body" data-reveal>
      {{{guide.sectionsHtml}}}
    </div>
  </section>

  <section class="section section-linen" aria-labelledby="guide-shows">
    <div class="container">
      <div class="section-head section-head-row" data-reveal>
        <div>
          <p class="kicker">SHOWS IN THIS GUIDE</p>
          <h2 id="guide-shows">รูปแบบการแสดงที่พูดถึงในบทความนี้</h2>
        </div>
        <a class="link-arrow" href="/shows/">ดูทุกรูปแบบและราคา</a>
      </div>
      {{{guide.showGrid}}}
    </div>
  </section>

  <section class="section section-deep section-compact" aria-labelledby="guide-more">
    <div class="container">
      <h2 id="guide-more" class="h-small">อ่านต่อ</h2>
      <ul class="pill-links">{{{guide.moreLinks}}}</ul>
    </div>
  </section>
</article>

{{> cta-band}}
