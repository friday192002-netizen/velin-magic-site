<article class="show-card" data-tags="{{show.tags}}" data-moods="{{show.moodTags}}" data-slug="{{show.slug}}">
  <a class="card-media" href="{{show.url}}" tabindex="-1" aria-hidden="true">
    {{{show.coverImg}}}
    <span class="card-num">{{show.num}}</span>
    {{#show.isVelin}}<span class="card-badge">แสดงโดย Velin</span>{{/show.isVelin}}
  </a>
  <div class="card-body">
    <p class="kicker">{{show.en}}</p>
    <{{heading}} class="card-title"><a href="{{show.url}}">{{show.th}}</a></{{heading}}>
    <p class="card-text">{{show.tagline}}</p>
    <div class="card-foot">
      <p class="price">{{#show.priceFrom}}<span class="price-from">เริ่มต้น</span>{{/show.priceFrom}}<span class="price-amount">{{show.priceText}}</span></p>
      <a class="card-cta" href="{{show.url}}">ดูรายละเอียด<span class="sr">{{show.th}}</span>
        <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
  </div>
</article>
